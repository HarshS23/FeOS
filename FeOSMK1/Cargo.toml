[package]
name = "FeOSMK1"
version = "0.1.0"
edition = "2024"
authors = ["Authors Harsh.shokka@gmail.com"]

[dependencies]
bootloader = "0.9.8"
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort" # disable stack unwinding on panic 

[profile.release]
panic = "abort" # disable stack unwinding on panic 

# double brackets means keys that can appear multiple times
[[bin]] # specifies how cargo should compile the executable 
name = "FeOSMK1"
test = true # do not build binary in test mode 
bench = false # do not build binary in bench mode 

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04"]





